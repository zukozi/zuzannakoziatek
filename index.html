        .image-viewport {

            height: 100%;
        }

        .image-viewport img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 600ms ease-in-out, transform 600ms ease;
            transform: scale(1.03);
        }

        .image-viewport img.active {
            opacity: 1;
            transform: scale(1);
        }

        @media (max-width: 900px) {

      <script>
        // Sync images to paragraphs using IntersectionObserver.
        (function () {
          const paragraphs = Array.from(document.querySelectorAll('.about-paragraph'));
          const images = Array.from(document.querySelectorAll('.image-viewport img'));

          // Map image filenames to their img element index for quick lookup
          const srcToImg = new Map(images.map((img, i) => [img.getAttribute('src'), i]));

          function showImageByIndex(index) {
            images.forEach((img, i) => {
              if (i === index) {
                img.classList.add('active');
              } else {
                img.classList.remove('active');
              }
            });
          }

          // When a paragraph is in view (most visible), switch to its image
          const observerOptions = {
            root: null,
            rootMargin: '0px',
            threshold: buildThresholdList()
          };

          function buildThresholdList() {
            const thresholds = [];
            for (let i=0; i<=1.0; i+=0.05) thresholds.push(i);
            return thresholds;
          }

          const visibilityMap = new Map(); // paragraph -> visibility ratio

          const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
              visibilityMap.set(entry.target, entry.intersectionRatio);
            });

            // pick the paragraph with highest visibility
            let mostVisible = null;
            let maxRatio = 0;
            for (const [el, ratio] of visibilityMap.entries()) {
              if (ratio > maxRatio) { maxRatio = ratio; mostVisible = el; }
            }

            if (mostVisible) {
              const imgSrc = mostVisible.getAttribute('data-image');
              // Find image index: try exact filename, otherwise use paragraph index
              let idx = srcToImg.get(imgSrc);
              if (idx === undefined) {
                idx = paragraphs.indexOf(mostVisible);
                if (idx < 0 || idx >= images.length) idx = 0;
              }
              showImageByIndex(idx);
            }

          }, observerOptions);

          paragraphs.forEach(p => {
            visibilityMap.set(p, 0);
            observer.observe(p);
          });

          // Accessibility: keyboard navigation between paragraphs updates image
          paragraphs.forEach((p, i) => {
            p.setAttribute('tabindex', '0');
            p.addEventListener('focus', () => { showImageByIndex(i); });
          });

        })();
      </script>
