<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>zuzanna koziatek</title>
    <link rel="stylesheet" href="styles-enhanced.css">
    <style>
        /* ========================================== 
           INDEX-SPECIFIC OVERRIDES
           ========================================== */

        header {
            background: linear-gradient(rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.35)), url("We're Just Here for the view.png");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            padding: 6rem 2rem;
            text-align: center;
            min-height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        header h1 {
            font-size: 6rem;
            font-weight: 800;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.6);
            letter-spacing: -0.5px;
            color: white;
        }

        header .subtitle {
            opacity: 0.95;
            margin-top: 0.5rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            color: white;
        }

        nav {
            display: flex;
            justify-content: center;
            gap: 1rem;
            padding: 1rem;
            background: transparent;
            margin: 2rem auto;
            max-width: 1200px;
            flex-wrap: wrap;
        }

        nav a {
            text-decoration: none;
            color: #0f0f1e;
            padding: 0.6rem 1.2rem;
            background: rgba(255, 255, 255, 0.8);
            font-weight: 600;
            transition: all 0.3s ease;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 0.3px;
            border: 2px solid transparent;
        }

        nav a:hover {
            background: #2c3e50;
            color: white;
            border-color: #2c3e50;
        }

        .separator {
            height: 2px;
            background: linear-gradient(to right, transparent, #2c3e50, transparent);
        }

        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 1rem;
        }

        .course-section {
            background: #ffffff;
            padding: 2rem;
            box-shadow: 0 8px 16px rgba(15, 15, 30, 0.12);
            margin-bottom: 2rem;
            border-left: 5px solid #2c3e50;
        }

        .course-section h2 {
            text-align: center;
            color: white;
            margin-bottom: 1.5rem;
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            border-bottom: 3px solid #2c3e50;
            padding-bottom: 1rem;
            background: #2c3e50;
            margin: -2rem -2rem 1.5rem -2rem;
            padding: 1.5rem 2rem 1rem 2rem;
        }

        .course-section p {
            color: white;
            line-height: 1.8;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Calibri, sans-serif;
            font-weight: 500;
        }

        /* Video section styles */
        .video-section {
            display: flex;
            justify-content: center;
            margin: 2rem 0;
        }

        .video-container {
            width: 100%;
            max-width: 560px;
        }

        .video-container iframe {
            width: 100%;
            height: auto;
            aspect-ratio: 560/315;
            box-shadow: 0 8px 16px rgba(15, 15, 30, 0.12);
            border: 1px solid #d4d4d8;
        }

        /* Gallery styles */
        .gallery-section {
            margin-top: 1rem;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
        }

        .gallery-item {
            position: relative;
            overflow: hidden;
            cursor: pointer;
            background: #eee;
            box-shadow: 0 6px 18px rgba(15, 15, 30, 0.1);
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .gallery-item:hover {
            transform: translateY(-4px);
            box-shadow: 0 16px 32px rgba(15, 15, 30, 0.15);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.35s ease;
            aspect-ratio: 1;
        }

        .gallery-item .title {
            position: absolute;
            left: 12px;
            bottom: 12px;
            color: #fff;
            background: rgba(0, 0, 0, 0.65);
            padding: 8px 12px;
            font-weight: 700;
            font-size: 0.95rem;
            backdrop-filter: blur(4px);
            z-index: 2;
        }

        .gallery-item::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.25), transparent);
            opacity: 0;
            transition: opacity 0.25s ease;
            z-index: 1;
        }

        .gallery-item:hover img {
            transform: scale(1.05);
        }

        .gallery-item:hover::after {
            opacity: 1;
        }

        /* Modal / lightbox */
        .lightbox {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 9999;
            backdrop-filter: blur(4px);
        }

        .lightbox.open {
            display: flex;
        }

        .lightbox-card {
            width: 100%;
            max-width: 1100px;
            background: var(--card-bg);
            overflow: hidden;
            display: flex;
            gap: 0;
            box-shadow: 0 24px 48px rgba(15, 15, 30, 0.25);
            border: 1px solid #d4d4d8;
        }

        .lightbox-media {
            flex: 1 1 60%;
            min-height: 320px;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .lightbox-media img {
            max-width: 100%;
            max-height: 80vh;
            object-fit: contain;
            display: block;
        }

        .lightbox-info {
            flex: 1 1 40%;
            padding: 2rem;
            background: #2c3e50;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        .lightbox-info h3 {
            margin-bottom: 0.5rem;
            color: white;
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: -0.3px;
        }

        .lightbox-info h4 {
            margin: 0.25rem 0 1rem;
            color: #ecf0f1;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            font-size: 0.85rem;
        }

        .lightbox-info p {
            color: white;
            line-height: 1.8;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Calibri, sans-serif;
        }

        .lightbox-close {
            position: absolute;
            right: 24px;
            top: 18px;
            background: rgba(0, 0, 0, 0.5);
            border: none;
            color: #fff;
            font-size: 1.8rem;
            cursor: pointer;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .lightbox-close:hover {
            background: #2c3e50;
            transform: rotate(90deg);
        }

        /* Responsive */
        @media (max-width: 1000px) {
            .gallery-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .lightbox-card {
                flex-direction: column;
            }

            .lightbox-media {
                order: 0;
            }

            .lightbox-info {
                order: 1;
            }
        }

        @media (max-width: 600px) {
            .gallery-grid {
                grid-template-columns: 1fr;
            }

            header {
                padding: 3.5rem 1rem;
            }

            header h1 {
                font-size: 2.2rem;
            }

            .lightbox-info {
                padding: 1.5rem;
            }

            .lightbox-info h3 {
                font-size: 1.2rem;
            }

            .video-container iframe {
                aspect-ratio: 16/9;
            }

            .course-section {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <h1>zuzanna koziatek</h1>
            <p class="subtitle">teacher. writer. student.</p>
        </div>
    </header>
    <nav>
        <a href="index.html">Home</a>
        <a href="Writing-Resources.html">Writing Resources</a>
        <a href="teaching-portfolio.html">Teaching Portfolio</a>
        <a href="projects.html">Projects</a>
    </nav>
    <div class="separator"></div>
        <div class="course-section">
            <h2>About Your Instructor</h2>
            <p>Click any image to open a larger view and read a short description to the right.</p>
        </div>
</body>
</html>
