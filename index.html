<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>zuzanna koziatek</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --font-family-accessible: 'Segoe UI', 'Helvetica Neue', -apple-system, BlinkMacSystemFont, sans-serif;
            --primary-color: #333333;
            --secondary-color: #666666;
            --background-color: #ffffff;
        }

        body {
            font-family: var(--font-family-accessible);
            background-color: var(--background-color);
            color: var(--primary-color);
        }

        header {
            padding: 4rem 2rem;
            text-align: center;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            line-height: 1.1;
            color: var(--primary-color);
            margin-bottom: 1rem;
        }

        .subtitle {
            font-size: 1.5rem;
            font-weight: 400;
            letter-spacing: 0.05em;
            color: var(--secondary-color);
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
            }

            .subtitle {
                font-size: 1.25rem;
            }

            header {
                padding: 3rem 1rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>zuzanna koziatek</h1>
        <p class="subtitle">teacher. writer. student.</p>
    </header>
</body>
</html>
